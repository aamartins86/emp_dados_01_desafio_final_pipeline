name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Testes Python e PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emprega_dados_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emprega_dados_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/emprega_dados_test

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes unitários e de integração
        run: python -B -m pytest -q

      - name: Validar JavaScript do portal
        run: node --check src/web/static/app.js
